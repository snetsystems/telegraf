[global_tags]
  # dc = "us-east-1" # will tag all metrics with dc=us-east-1
  # rack = "1a"
  ## Environment variables can be used as tags, and throughout the config file
  # user = "$USER"

[agent]
  interval = "1m"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "10s"
  precision = ""
  hostname = "<hostname>"
  omit_hostname = false

[[outputs.influxdb]]
  urls = [ "http://<influxdb_host>:<influxdb_port>" ]
  database = "<database>"
  retention_policy = "<retention_policy>"
  write_consistency = "any"
  username = "<username>"
  password = "<password>"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false

[[inputs.disk]]
  ignore_fs = [
    "tmpfs",
    "devtmpfs",
    "devfs",
    "iso9660",
    "overlay",
    "aufs",
    "squashfs"
  ]

[[inputs.diskio]]
  [inputs.diskio.tagdrop]
    name = [
      "loop*",             # (Linux) Snap package virtual devices
      "ram*",              # (Linux) RAM disk
      "sr*",               # (Linux) CD-ROM / DVD
      "fd*",               # (Linux) Floppy disk
      "dm-*",              # (Linux) LVM (exclude if necessary)
      "HarddiskVolume*"    # (Windows) Volumes without drive letters
    ]

[[inputs.kernel]]
[[inputs.mem]]
[[inputs.processes]]
[[inputs.swap]]
[[inputs.net]]
[[inputs.netstat]]

[[inputs.procstat]]
  systemd_unit = "snet-salt-minion"
[[inputs.procstat]]
  systemd_unit = "telegraf"

[[inputs.system]]
